name: conventions
on: [push, pull_request]
jobs:
  conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 12.11.2 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: lint (eslint + ast-grep + ls-lint, rule ids in every message)
        run: pnpm exec conventions lint
      - name: structural checks (modules, tests, header, deviations, inventory)
        run: pnpm exec conventions check
      - run: pnpm typecheck
      - run: pnpm test
