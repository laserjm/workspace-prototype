name: conventions
on: [push, pull_request]
jobs:
  conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 12.11.2 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: lint (eslint + ast-grep + ls-lint, rule ids in every message)
        run: pnpm exec conventions lint
      - name: styling on the design tokens (STYLE-01…03, scripts/check-styles.mjs)
        run: pnpm lint:styles
      - name: structural checks (modules, tests, header, deviations, inventory)
        run: pnpm exec conventions check
      - name: schema drift (NX-DB-01) — a schema.ts change needs its generated migration
        run: |
          pnpm db:check
          pnpm db:generate
          test -z "$(git status --porcelain drizzle)" || { git status --porcelain drizzle; exit 1; }
      - run: pnpm typecheck
      - run: pnpm test
