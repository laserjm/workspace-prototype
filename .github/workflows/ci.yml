name: ci
on: [push, pull_request]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 12.11.2 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: lint (ESLint, design tokens)
        run: pnpm lint
      - name: schema drift — a schema.ts change needs its generated migration
        run: |
          pnpm db:check
          pnpm db:generate
          test -z "$(git status --porcelain lib/db/migrations)" || { git status --porcelain lib/db/migrations; exit 1; }
      - run: pnpm typecheck
      - run: pnpm test
